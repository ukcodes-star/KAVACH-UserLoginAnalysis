spring.config.import=optional:file:.env[.properties]
spring.application.name=login-analysis-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/login_analysis_db
spring.datasource.username=postgres
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=900000

# Official xAI Grok API Configuration
xai.api.key=${XAI_API_KEY:${GROK_API_KEY:}}
xai.api.base-url=${XAI_BASE_URL:${GROK_BASE_URL:https://api.x.ai/v1}}
xai.api.model=${XAI_MODEL:${GROK_MODEL:grok-4-fast}}
xai.api.timeout-seconds=25

# Grok alias
grok.api.key=${xai.api.key}
grok.api.base-url=${xai.api.base-url}
grok.api.model=${xai.api.model}
